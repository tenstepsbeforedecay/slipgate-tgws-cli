name: build-cli
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate: сборка и smoke без публикации; release: штатный выпуск'
        type: choice
        options: [validate, release]
        default: validate
        required: true
      tag:
        description: 'Стабильный upstream tag (пусто = latest); опубликованные релизы неизменяемы'
        default: ''
        required: false
permissions: {}
concurrency:
  group: build-cli-publication
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # List releases скрывает drafts от токена без push access.
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      skip: ${{ steps.resolve.outputs.skip }}
      recover: ${{ steps.resolve.outputs.recover }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: '3.11.14'
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_MODE: release
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python scripts/release.py resolve
  validate-resolve:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'workflow_dispatch' && inputs.mode == 'validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11.14'
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_MODE: validate
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python scripts/release.py validate
  build:
    needs: [resolve, validate-resolve]
    if: always() && !cancelled() && (needs.validate-resolve.result == 'success' || (needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.recover == ''))
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: Flowseal/tg-ws-proxy
          ref: ${{ needs.validate-resolve.outputs.commit || needs.resolve.outputs.commit }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11.14'
          architecture: x64
      - name: Проверки публикации
        run: python -m unittest discover -s scripts -p test_release.py -v
      - name: Зафиксированные инструменты сборки
        run: 'python -m pip install --only-binary=:all: --retries 3 --timeout 30 pip==25.3 packaging==25.0 pyinstaller==6.16.0'
      - name: Сборка и проверки
        env:
          TAG: ${{ needs.validate-resolve.outputs.tag || needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate-resolve.outputs.commit || needs.resolve.outputs.commit }}
        run: python scripts/build-ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.validate-resolve.result == 'success' && 'cli-validation' || 'cli-staging' }}
          path: bundle/*
          if-no-files-found: error
          retention-days: 30
      - name: Отчёт об остановке
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-required
          path: |
            review-required.txt
            upstream/smoke-output.txt
            upstream/pip-report.json
          if-no-files-found: ignore
  publish:
    needs: [resolve, build]
    if: always() && !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true' && (needs.build.result == 'success' || needs.resolve.outputs.recover != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11.14'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0, Node 24
        with:
          name: cli-staging
          path: bundle
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.recover || github.run_id }}
      - name: Проверка production validator
        run: node scripts/validate-manifest.cjs bundle/capabilities.json
      - name: Draft → readback SHA256 → publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RECOVER_RUN: ${{ needs.resolve.outputs.recover }}
          RUN_MODE: release
        run: python scripts/release.py publish
